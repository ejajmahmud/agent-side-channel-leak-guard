[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-side-channel-leak-guard"
version = "0.1.0"
description = "Microsecond-precision timing jitter and payload size padding proxy preventing side-channel inference on private LLM databases"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-side-channel-leak-guard = "agent_side_channel_leak_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_side_channel_leak_guard*"]
